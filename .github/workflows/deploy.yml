name: Deploy Yuksalish Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1-bosqich: image qurish va GHCR ga yuborish ──────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image nomini kichik harflarga o'tkazish
        id: meta
        run: |
          # GHCR faqat kichik harfli nomlarni qabul qiladi (repo nomida
          # bosh harf bo'lishi mumkin).
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR ga login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build va push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # Bilddan bildga cache — qayta qurish sezilarli tezlashadi.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2-bosqich: serverda yangi image bilan qayta ishga tushirish ──────────────
  # Serverda git repo YO'Q — faqat docker-compose.yml, .env va data/ kerak.
  # docker-compose.yml shu job'ning o'zi tomonidan yetkaziladi.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: docker-compose.yml ni tayyorlash
        id: compose
        run: echo "b64=$(base64 -w0 docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,COMPOSE_B64,DEPLOY_PATH
          script: |
            set -euo pipefail

            # eval — DEPLOY_PATH da '~' bo'lsa ham to'g'ri ochilishi uchun.
            eval DEPLOY_DIR="$DEPLOY_PATH"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            echo "📁 $(pwd)"

            # docker-compose.yml ni repodan yetkazamiz — serverda git kerak emas.
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

            # .env serverda qo'lda turadi — unga tegmaymiz, faqat borligini
            # tekshiramiz, aks holda bot token'siz ishga tushib yiqiladi.
            if [ ! -f .env ]; then
              echo "❌ .env fayli topilmadi: $(pwd)/.env"
              exit 1
            fi

            # Ma'lumotlar papkasi (SQLite + loglar). Konteyner ichida appuser
            # UID 1000 bilan ishlaydi, shuning uchun papka o'shanga tegishli bo'lsin.
            mkdir -p data
            if [ "$(stat -c %u data)" != "1000" ]; then
              sudo chown -R 1000:1000 data \
                || chown -R 1000:1000 data \
                || echo "⚠️  data/ egasini o'zgartirib bo'lmadi — bot yozolmasligi mumkin"
            fi

            # Aynan shu commit'ning image'ini ishlatamiz (latest emas) —
            # shunda qaysi versiya ishlayotgani aniq va rollback oson.
            echo "IMAGE=$IMAGE"

            # --no-build muhim: image tortilmasa, compose serverdagi
            # kontekstdan jimgina o'zi qurib qo'ymasin. Shunda xato yashirinmaydi.
            docker compose pull
            docker compose up -d --remove-orphans --no-build

            docker inspect -f 'Ishlayotgan image: {{.Config.Image}} ({{.Image}})' yuksalish_bot

            # Eski, ishlatilmayotgan image'lar diskni yeb qo'ymasin.
            docker image prune -f

            # Konteyner haqiqatan ko'tarilganini tekshiramiz.
            sleep 5
            docker compose ps
            if [ "$(docker inspect -f '{{.State.Running}}' yuksalish_bot)" != "true" ]; then
              echo "❌ Konteyner ishga tushmadi. Oxirgi loglar:"
              docker compose logs --tail 50
              exit 1
            fi
            echo "✅ Deploy muvaffaqiyatli: $IMAGE"
            docker compose logs --tail 20
