name: Deploy Yuksalish Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1-bosqich: image qurish va GHCR ga yuborish ──────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image nomini kichik harflarga o'tkazish
        id: meta
        run: |
          # GHCR faqat kichik harfli nomlarni qabul qiladi (repo nomida
          # bosh harf bo'lishi mumkin).
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR ga login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build va push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # Bilddan bildga cache — qayta qurish sezilarli tezlashadi.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2-bosqich: serverdagi umumiy stack ichida shu servisni yangilash ────────
  # MUHIM: bu job serverdagi docker-compose.yml ga TEGMAYDI. U fayl qo'lda
  # boshqariladi va boshqa loyihalarni ham saqlaydi. Biz faqat kerakli
  # image'ni tortib, faqat `yuksalish-bot` servisini qayta ishga tushiramiz.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE: yuksalish-bot
          # GHCR paketi private bo'lsa kerak. Public bo'lsa bo'sh qoldiring.
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,DEPLOY_PATH,SERVICE,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail

            # eval — DEPLOY_PATH da '~' bo'lsa ham to'g'ri ochilishi uchun.
            eval DEPLOY_DIR="$DEPLOY_PATH"
            cd "$DEPLOY_DIR"
            echo "📁 $(pwd)"

            # Bu fayllar serverda qo'lda boshqariladi — biz ularni faqat
            # o'qiymiz, hech qachon yozmaymiz.
            [ -f docker-compose.yml ] || { echo "❌ docker-compose.yml topilmadi: $(pwd)"; exit 1; }
            [ -f .env ] || { echo "❌ .env topilmadi: $(pwd)"; exit 1; }

            # Servis shu compose faylda bormi? Bo'lmasa image'ni behuda tortmaymiz
            # va DEPLOY_PATH noto'g'ri papkani ko'rsatayotganini darhol aytamiz.
            if ! docker compose config --services | grep -qx "$SERVICE"; then
              echo "❌ '$SERVICE' servisi bu papkadagi docker-compose.yml da yo'q."
              echo "   Papka: $(pwd)"
              echo "   Mavjud servislar:"
              docker compose config --services | sed 's/^/     - /'
              echo "   DEPLOY_PATH secret'i to'g'ri papkani ko'rsatyaptimi?"
              exit 1
            fi

            # GHCR paketi private bo'lsa, tortish uchun login kerak.
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "🔑 ghcr.io ga login ($GHCR_USER)"
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            # Aynan shu commit'ning image'ini tortamiz, so'ng uni lokal :latest
            # deb belgilaymiz. Shunda compose fayl :latest ga qarab tursa ham,
            # ishga tushadigan narsa aniq shu commit bo'ladi.
            echo "IMAGE=$IMAGE"
            if ! docker pull "$IMAGE"; then
              echo "❌ Image tortilmadi. Ehtimoliy sabab: GHCR paketi private."
              echo "   Yechim 1: paketni public qiling —"
              echo "   https://github.com/users/$GHCR_USER/packages/container/yuksalish_bot/settings"
              echo "   Yechim 2: GHCR_TOKEN secret'ini qo'shing (read:packages huquqli PAT)."
              exit 1
            fi
            docker tag "$IMAGE" "${IMAGE%:*}:latest"

            # --no-deps: qo'shni servislarga (postgres, nginx, boshqa botlar)
            # tegilmasin. --remove-orphans ATAYLAB yo'q: u umumiy compose
            # faylda begona konteynerlarni o'chirib yuboradi.
            docker compose up -d --no-deps "$SERVICE"

            docker inspect -f 'Ishlayotgan image: {{.Config.Image}} ({{.Image}})' "$SERVICE"

            # Faqat tegsiz (dangling) image'lar o'chadi, boshqa loyihalarniki emas.
            docker image prune -f

            sleep 5
            docker compose ps "$SERVICE"
            if [ "$(docker inspect -f '{{.State.Running}}' "$SERVICE")" != "true" ]; then
              echo "❌ Konteyner ishga tushmadi. Oxirgi loglar:"
              docker compose logs --tail 50 "$SERVICE"
              exit 1
            fi
            echo "✅ Deploy muvaffaqiyatli: $IMAGE"
            docker compose logs --tail 20 "$SERVICE"
